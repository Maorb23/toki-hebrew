[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "toki-hebrew"
version = "0.1.0"
description = "Local, suggestion-only Hebrew spelling analysis"
requires-python = ">=3.10"
dependencies = ["symspellpy>=6.7,<7"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
